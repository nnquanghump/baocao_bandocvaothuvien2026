<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo cáo lượt độc giả — Trung tâm học liệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#F6F7FB; --surface:#FFFFFF; --surface-2:#FBFBFE;
    --border:#E6E8F0; --text:#12131A; --text-soft:#6B7080; --text-faint:#9CA0B0;
    --indigo:#5B5FEF; --indigo-soft:#EEEEFD;
    --teal:#0EA5A5; --teal-soft:#E6F8F6;
    --amber:#E29A3C; --amber-soft:#FCF1E1;
    --green:#22B573;
    --font-display:'Space Grotesk', 'Inter', sans-serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', 'IBM Plex Mono', monospace;
    --r-lg:18px; --r-md:14px; --r-sm:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-body); min-height:100vh; padding:36px 24px 90px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px; margin:0 auto;}

  /* ---- Header ---- */
  header.top{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:16px; margin-bottom:28px;}
  .live-badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:0.72rem; font-weight:600; letter-spacing:0.06em; color:var(--green); text-transform:uppercase; margin-bottom:10px;}
  .live-dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(34,181,115,0.5); animation:pulse 2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,181,115,0.45);}
    70%{box-shadow:0 0 0 7px rgba(34,181,115,0);}
    100%{box-shadow:0 0 0 0 rgba(34,181,115,0);}
  }
  header.top h1{font-family:var(--font-display); font-weight:700; font-size:1.9rem; margin:0; letter-spacing:-0.01em;}
  .eyebrow{font-family:var(--font-mono); font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:2px;}
  .status-block{text-align:right;}
  .status{font-family:var(--font-mono); font-size:0.76rem; color:var(--text-soft);}
  .month-badge{display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:0.8rem; font-weight:600; background:var(--indigo-soft); color:var(--indigo); padding:7px 14px; border-radius:999px; margin-top:8px;}

  /* ---- KPI row ---- */
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:16px;}
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:20px 22px;}
  .kpi-card .lbl{font-size:0.8rem; color:var(--text-soft); margin-bottom:8px;}
  .kpi-card .num{font-family:var(--font-mono); font-size:2rem; font-weight:600; letter-spacing:-0.02em;}
  .kpi-card .num.indigo{color:var(--indigo);}
  .kpi-card .num.teal{color:var(--teal);}

  /* ---- Trend chart card ---- */
  .trend-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:22px 24px; margin-bottom:16px;}
  .trend-card h2{font-family:var(--font-display); font-size:1.05rem; font-weight:600; margin:0 0 2px;}
  .trend-sub{font-size:0.8rem; color:var(--text-soft); margin-bottom:16px;}
  .chart-box{height:260px;}

  /* ---- Region cards ---- */
  .region-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-bottom:16px;}
  .region-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:20px 22px;}
  .region-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .region-head h3{font-family:var(--font-display); font-size:1rem; font-weight:600; margin:0;}
  .region-swatch{width:10px; height:10px; border-radius:3px;}
  .region-nums{display:flex; gap:22px; margin-bottom:10px;}
  .region-nums .num{font-family:var(--font-mono); font-size:1.4rem; font-weight:600;}
  .region-nums .lbl{font-size:0.72rem; color:var(--text-soft); margin-top:2px;}
  .spark-box{height:44px; margin-bottom:14px;}
  .top-list{border-top:1px solid var(--border); padding-top:12px;}
  .top-list .cap{font-size:0.72rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px;}
  .top-row{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:0.85rem;}
  .top-rank{width:20px; height:20px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:0.68rem; color:var(--text-soft); flex-shrink:0;}
  .top-name{flex:1; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .top-count{font-family:var(--font-mono); font-size:0.78rem; color:var(--text-soft);}

  /* ---- Leaderboard ---- */
  .leaderboard{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:22px 24px; margin-bottom:16px;}
  .leaderboard h2{font-family:var(--font-display); font-size:1.05rem; font-weight:600; margin:0 0 16px;}
  .lb-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px;}
  .lb-item{display:flex; align-items:center; gap:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md); padding:11px 14px;}
  .lb-rank{width:26px; height:26px; border-radius:50%; background:var(--amber-soft); color:var(--amber); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:600; font-size:0.78rem; flex-shrink:0;}
  .lb-item:nth-child(1) .lb-rank{background:var(--indigo-soft); color:var(--indigo);}
  .lb-name{flex:1; font-family:var(--font-mono); font-size:0.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lb-count{font-family:var(--font-mono); font-size:0.78rem; color:var(--text-soft);}

  .note-box{font-size:0.82rem; color:var(--text-faint); padding:14px 4px;}
  .setup{background:#FFF7ED; border:1px solid #F3D9B5; color:#92400E; border-radius:var(--r-md); padding:18px 20px; font-family:var(--font-mono); font-size:0.82rem; line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="live-badge"><span class="live-dot"></span>Trực tiếp</div>
      <div class="eyebrow">Trung tâm học liệu</div>
      <h1>Lượt độc giả vào thư viện</h1>
      <div id="monthBadge"></div>
    </div>
    <div class="status-block">
      <div class="status" id="statusLine">Đang tải dữ liệu…</div>
    </div>
  </header>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="trend-card">
    <h2>Xu hướng 12 tháng gần nhất</h2>
    <div class="trend-sub" id="trendSub">Lượt vào theo từng khu vực</div>
    <div class="chart-box"><canvas id="trendChart"></canvas></div>
  </div>

  <div class="region-grid" id="regionGrid"></div>

  <div class="leaderboard">
    <h2>Top 5 độc giả — toàn hệ thống (tháng gần nhất)</h2>
    <div class="lb-grid" id="top5Overall"></div>
  </div>

  <div class="note-box" id="noteBox"></div>
  <div class="setup" id="setupBox" style="display:none;"></div>
</div>

<script>
/* ============================================================
   CẤU HÌNH — chỉ cần sửa ở đây.
   ============================================================ */
const REGIONS = [
  { name: 'Tầng 1', spreadsheetId: '1JvRIVr9X55dNtK20eLJw9XNYEmFLxv8V8-tHQ8pIJts', sheetName: 'Câu trả lời biểu mẫu 1' },
  { name: 'Tầng 2', spreadsheetId: '1jDrvkYFKU1htg2i5_GvNWhYN0zPwET_8rJDpKeUX4YQ', sheetName: 'Câu trả lời biểu mẫu 1' },
  { name: 'Tầng 3', spreadsheetId: '1lCqVRCPgRswdJiAP4icqsfeYox0SQ3jZoVJgX-uNkIk', sheetName: 'Câu trả lời biểu mẫu 1' }
];
const READER_DIRECTORY = null; // { spreadsheetId, sheetName } khi có file danh mục độc giả

const REGION_COLORS = ['#5B5FEF', '#0EA5A5', '#E29A3C'];

/* ============================================================
   LOGIC
   ============================================================ */
function gvizCsvUrl(spreadsheetId, sheetName){
  return `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}
async function fetchCsvRows(url){
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  let text = await res.text();
  text = text.replace(/^\uFEFF/, '');
  const parsed = Papa.parse(text, { skipEmptyLines: true, transform: v => (typeof v === 'string' ? v.trim() : v) });
  return parsed.data;
}
function chuanHoa(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function parseVNDateTime(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})/);
  if(m){ const [, dd, mm, yyyy, hh, mi, ss] = m; return new Date(+yyyy, +mm - 1, +dd, +hh, +mi, +ss); }
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
async function loadRegion(region){
  const rows = await fetchCsvRows(gvizCsvUrl(region.spreadsheetId, region.sheetName));
  if(!rows.length) return [];
  const header = rows[0].map(chuanHoa);
  const idxTime = header.findIndex(h => h.includes('dau thoi gian') || h.includes('thoi diem') || h.includes('thoi gian'));
  const idxMa = header.findIndex(h => h.includes('ma vach') || h.includes('ma doc gia') || h.includes('ma doc'));
  if(idxTime === -1 || idxMa === -1) throw new Error(`Không tìm thấy cột thời gian/mã độc giả trong "${region.name}"`);
  const out = [];
  for(let i = 1; i < rows.length; i++){
    const row = rows[i];
    const time = parseVNDateTime(row[idxTime]);
    const ma = (row[idxMa] || '').trim();
    if(!time || !ma) continue;
    out.push({ region: region.name, time, ma });
  }
  return out;
}
async function loadDirectory(){
  if(!READER_DIRECTORY) return {};
  const rows = await fetchCsvRows(gvizCsvUrl(READER_DIRECTORY.spreadsheetId, READER_DIRECTORY.sheetName));
  if(!rows.length) return {};
  const header = rows[0].map(chuanHoa);
  const idxMa = header.findIndex(h => h.includes('ma vach') || h.includes('ma doc gia') || h.includes('ma doc'));
  const idxTen = header.findIndex(h => h.includes('ho ten') || h.includes('ten'));
  const idxNganh = header.findIndex(h => h.includes('nganh'));
  const map = {};
  for(let i = 1; i < rows.length; i++){
    const row = rows[i];
    const ma = (row[idxMa] || '').trim();
    if(!ma) continue;
    map[ma] = { hoTen: idxTen > -1 ? row[idxTen] : '', nganh: idxNganh > -1 ? row[idxNganh] : '' };
  }
  return map;
}
function monthKeyOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function monthLabelOf(key){ const [y,m] = key.split('-'); return 'Th' + parseInt(m,10) + '/' + y; }
function readerLabel(ma, directory){
  const info = directory[ma];
  if(info && info.hoTen) return `${ma} — ${info.hoTen}`;
  return ma;
}

async function main(){
  const missing = REGIONS.some(r => !r.spreadsheetId || r.spreadsheetId.startsWith('DÁN_'));
  if(missing){ showSetupNeeded('Chưa điền đủ ID 3 file khu vực trong REGIONS.'); return; }

  let allRows = [];
  let directory = {};
  try{
    const results = await Promise.all(REGIONS.map(loadRegion));
    results.forEach(r => allRows = allRows.concat(r));
    directory = await loadDirectory();
  }catch(err){
    showSetupNeeded('Lỗi tải dữ liệu: ' + err.message + '. Kiểm tra chế độ chia sẻ file (cần "Bất kỳ ai có đường liên kết — Người xem") và tên tab.');
    return;
  }
  if(!allRows.length){ showSetupNeeded('Không đọc được dòng dữ liệu nào từ 3 file.'); return; }

  document.getElementById('statusLine').textContent = 'Cập nhật lúc ' + new Date().toLocaleString('vi-VN');

  const allMonthKeys = Array.from(new Set(allRows.map(r => monthKeyOf(r.time)))).sort();
  const latestMonth = allMonthKeys[allMonthKeys.length - 1];
  document.getElementById('monthBadge').innerHTML = `<span class="month-badge">📅 ${monthLabelOf(latestMonth)}</span>`;

  const latestRows = allRows.filter(r => monthKeyOf(r.time) === latestMonth);
  const totalLuot = latestRows.length;
  const uniqueReaders = new Set(latestRows.map(r => r.ma));

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card"><div class="lbl">Tổng lượt vào (toàn hệ thống)</div><div class="num indigo">${totalLuot.toLocaleString('vi-VN')}</div></div>
    <div class="kpi-card"><div class="lbl">Độc giả duy nhất (đã loại trùng)</div><div class="num teal">${uniqueReaders.size.toLocaleString('vi-VN')}</div></div>
    <div class="kpi-card"><div class="lbl">Khu vực đang theo dõi</div><div class="num">${REGIONS.length}</div></div>
  `;

  const last12 = allMonthKeys.slice(-12);
  const trendDatasets = REGIONS.map((region, i) => ({
    label: region.name,
    data: last12.map(mk => allRows.filter(r => r.region === region.name && monthKeyOf(r.time) === mk).length),
    borderColor: REGION_COLORS[i], backgroundColor: REGION_COLORS[i] + '22',
    tension: 0.35, fill: true, pointRadius: 3, pointBackgroundColor: REGION_COLORS[i], borderWidth: 2.5
  }));
  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: last12.map(monthLabelOf), datasets: trendDatasets },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'top', align:'end', labels:{ font:{family:'Inter', size:12}, usePointStyle:true, boxWidth:8 } } },
      scales:{
        y:{ beginAtZero:true, grid:{color:'#EEF0F5'}, ticks:{font:{family:'JetBrains Mono', size:10}, color:'#9CA0B0'} },
        x:{ grid:{display:false}, ticks:{font:{family:'Inter', size:11}, color:'#9CA0B0'} }
      }
    }
  });

  const grid = document.getElementById('regionGrid');
  grid.innerHTML = '';
  REGIONS.forEach((region, i) => {
    const rows = latestRows.filter(r => r.region === region.name);
    const byReader = {};
    rows.forEach(r => byReader[r.ma] = (byReader[r.ma] || 0) + 1);
    const top5 = Object.entries(byReader).sort((a,b) => b[1]-a[1]).slice(0,5);
    const uniq = new Set(rows.map(r => r.ma)).size;

    const card = document.createElement('div');
    card.className = 'region-card';
    card.innerHTML = `
      <div class="region-head"><h3>${region.name}</h3><span class="region-swatch" style="background:${REGION_COLORS[i]}"></span></div>
      <div class="region-nums">
        <div><div class="num">${rows.length}</div><div class="lbl">Tổng lượt</div></div>
        <div><div class="num">${uniq}</div><div class="lbl">Độc giả</div></div>
      </div>
      <div class="spark-box"><canvas id="spark_${i}"></canvas></div>
      <div class="top-list">
        <div class="cap">Top 5 độc giả</div>
        ${top5.length ? top5.map(([ma,c], idx) => `
          <div class="top-row">
            <span class="top-rank">${idx+1}</span>
            <span class="top-name">${readerLabel(ma, directory)}</span>
            <span class="top-count">${c} lượt</span>
          </div>`).join('') : '<div class="top-row" style="color:var(--text-faint)">Không có dữ liệu</div>'}
      </div>
    `;
    grid.appendChild(card);

    const sparkData = last12.slice(-8).map(mk => allRows.filter(r => r.region === region.name && monthKeyOf(r.time) === mk).length);
    new Chart(card.querySelector('#spark_' + i), {
      type: 'line',
      data: { labels: sparkData.map((_,j)=>j), datasets: [{ data: sparkData, borderColor: REGION_COLORS[i], borderWidth: 2, pointRadius: 0, tension: 0.4, fill:false }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{display:false}, y:{display:false} }, elements:{line:{borderJoinStyle:'round'}} }
    });
  });

  const byReaderAll = {};
  latestRows.forEach(r => byReaderAll[r.ma] = (byReaderAll[r.ma] || 0) + 1);
  const top5All = Object.entries(byReaderAll).sort((a,b) => b[1]-a[1]).slice(0,5);
  document.getElementById('top5Overall').innerHTML = top5All.length ? top5All.map(([ma,c], idx) => `
    <div class="lb-item"><span class="lb-rank">${idx+1}</span><span class="lb-name">${readerLabel(ma, directory)}</span><span class="lb-count">${c} lượt</span></div>
  `).join('') : '<div class="lb-item">Không có dữ liệu</div>';

  document.getElementById('noteBox').textContent = READER_DIRECTORY
    ? 'Đã nối danh mục độc giả.'
    : 'Đang hiện mã độc giả thay vì họ tên vì chưa nối danh mục độc giả. Gửi file danh mục để bật tên + báo cáo theo ngành.';
}

function showSetupNeeded(msg){
  document.getElementById('statusLine').textContent = 'Chưa sẵn sàng';
  const box = document.getElementById('setupBox');
  box.style.display = 'block';
  box.textContent = msg;
}
main();
</script>
</body>
</html>
